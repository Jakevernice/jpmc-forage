# application.yml
server:
  port: 8080

spring:
  application:
    name: midas-core
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: midas-core-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.jpmc.midascore.foundation"
  main:
    allow-bean-definition-overriding: true

# Custom application properties
general:
  kafka-topic: midas-core-topic

# Optional - logging
logging:
  level:
    root: INFO
    com.jpmc.midascore: DEBUG

# Optional - test-specific profile if you have a separate test config
---
spring:
  config:
    activate:
      on-profile: test
general:
  kafka-topic: test-midas-core-topic