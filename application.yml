# application.yml
server:
  port: 33400

spring:
  application:
    name: midas-core
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.jpmc.midascore.foundation"
  datasource:
    url: jdbc:h2:mem:midasdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  main:
    allow-bean-definition-overriding: true

# Custom application properties
general:
  kafka-topic: midas-core-topic

# Optional - logging
logging:
  level:
    root: INFO
    com.jpmc.midascore: DEBUG

# Optional - test-specific profile if you have a separate test config
---
spring:
  config:
    activate:
      on-profile: test
general:
  kafka-topic: test-midas-core-topic